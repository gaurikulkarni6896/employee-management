<div class="details-page">

  <h1>Employee Details</h1>

  <button
    type="button"
    (click)="goBack()">
    ← Back to Employees
  </button>

  <hr>

  <div *ngIf="employee">

    <h2>{{ employee.name }}</h2>

    <p>
      <strong>ID:</strong>
      {{ employee.id }}
    </p>

    <p>
      <strong>Email:</strong>
      {{ employee.email }}
    </p>

    <p>
      <strong>Department:</strong>
      {{ employee.department }}
    </p>

    <p>
      <strong>City:</strong>
      {{ employee.city }}
    </p>

  </div>

  <div *ngIf="!employee && !isLoading">

    <p>No employee data found.</p>

  </div>

  <div *ngIf="isLoading">

    <p>Loading employee...</p>

  </div>

</div>
